name: Trigger auto deployment for aca-nginx-standard-r1e4bw

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/aca-nginx-standard-r1e4bw-AutoDeployTrigger-0fe48514-083e-4929-b75c-5e4e5912a3a4.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ACANGINXSTANDARDR1E4BW_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.ACANGINXSTANDARDR1E4BW_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.ACANGINXSTANDARDR1E4BW_AZURE_SUBSCRIPTION_ID }}

      - name: Build and deploy container
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Dockerfile
          registryUrl: docker.io
          registryUsername: ${{ secrets.ACANGINXSTANDARDR1E4BW_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.ACANGINXSTANDARDR1E4BW_REGISTRY_PASSWORD }}
          containerAppName: aca-nginx-standard-r1e4bw
          resourceGroup: rg-aca-lab-R1E4BW
          imageToBuild: bartusbende/aca-nginx-standard-r1e4bw:${{ github.sha }}
